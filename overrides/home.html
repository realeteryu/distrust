{% extends "main.html" %}

{% block extrahead %}
  {{ super() }}
  <style>
    .md-content__inner > h1:first-child,
    .md-content__inner .md-typeset > h1:first-child,
    .md-content__inner h1:first-of-type,
    .md-typeset h1:first-of-type {
      display: none !important;
    }

    /* Nowy, spójny styl dla wszystkich przycisków w hero */
    .hero-btn-custom {
      display: inline-block;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: white !important;
      background-color: transparent !important;
      border: 1px solid #5c6bc0 !important;
      border-radius: 999px;
      text-decoration: none !important;
      transition: all 0.2s ease;
      line-height: 1;
    }

    .hero-btn-custom:hover {
      background-color: rgba(92, 107, 192, 0.2) !important;
      border-color: #818cf8 !important;
      color: white !important;
    }
  </style>
{% endblock %}

{% block tabs %}
  {{ super() }}
  <section class="mdx-hero">
    <div class="mdx-hero__inner">
      <h1>Nie ufaj domyślnie.</h1>
      <p>Ale najpierw wiedz, czemu.</p>
      
      <!-- Wszystkie trzy przyciski mają teraz ten sam styl -->
      <div style="display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem;">
        <a href="zasady/domyslne-ustawienia/" class="hero-btn-custom">Zacznij od pierwszej zasady</a>
        <a href="o-projekcie/" class="hero-btn-custom">O projekcie</a>
      </div>

      <div style="text-align: center;">
        <a href="faq/" class="hero-btn-custom">Masz pytania? Sprawdź FAQ</a>
      </div>

    </div>
    
    <svg class="mdx-hero__wave" viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path fill="var(--md-default-bg-color)" d="M0,64L60,69.3C120,75,240,85,360,80C480,75,600,53,720,53.3C840,53,960,75,1080,80C1200,85,1320,75,1380,69.3L1440,64L1440,120L0,120Z"></path>
    </svg>
  </section>
{% endblock %}
